name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the Docs drift check, which holds the CLI reference and every
      # `breakpoint …` example in the Docs and the README to the CLI's own parser.
      - run: npm run test:unit

  e2e:
    name: End to end (macOS)
    # Playwright launches the real app and drives it with the CLI. The launcher is
    # /bin/sh and the suite has only ever run on macOS, so this job is macOS-only
    # by design rather than by omission.
    #
    # Non-blocking until the suite is stable on a runner. It passes 155/155 locally
    # and fails a different handful every time on CI — 6, then 3, then 2, never the
    # same tests twice. e2e/harness.ts PATIENCE already scales every deadline 3x and
    # is demonstrably active (the timeout reports 60000ms, not 20000ms), so what is
    # left is not slowness: a 60s wait for a socket is an app that never started.
    # See issue #47. Deliberately NOT solved with `retries`, which would turn the
    # board green and hide exactly the launch and socket timing the agent story
    # depends on.
    continue-on-error: true
    runs-on: macos-latest
    # The suite launches real Electron processes, and #47 is about launches that
    # sometimes never produce a socket — so a genuine hang is a live possibility,
    # not a hypothetical. Without this the job inherits GitHub's 360 minute
    # default and sits on a macOS runner for six hours. Worst observed run is
    # 12.7 minutes, and PATIENCE makes a failing run slower than a passing one.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
