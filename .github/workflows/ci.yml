name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same branch makes the first one's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Includes the Docs drift check, which holds the CLI reference and every
      # `breakpoint …` example in the Docs and the README to the CLI's own parser.
      - run: npm run test:unit

  e2e:
    name: End to end (macOS)
    # Playwright launches the real app and drives it with the CLI. The launcher is
    # /bin/sh and the suite has only ever run on macOS, so this job is macOS-only
    # by design rather than by omission.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
