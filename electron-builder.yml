appId: com.breakpoint.app
productName: Breakpoint
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # Nothing outside the built app ships. docs/ is the PRD, ADRs and design
  # reference; prototypes/ is throwaway spike code kept as a primary source;
  # sites/ is the marketing and docs site, deployed separately. The directory is
  # `sites`, plural — an earlier `site` here matched nothing and shipped the whole
  # Site inside app.asar.
  - '!{docs,prototypes,sites}/**'
  # The test suite and its config are not part of the product.
  - '!{e2e,test-results}/**'
  - '!{playwright.config.ts,vitest.config.ts,netlify.toml}'
  # bin/breakpoint is the development launcher: it resolves the repo it sits in,
  # so inside app.asar it is both unreachable and wrong. The packaged launcher is
  # a separate thing.
  - '!bin/**'
  - '!{AGENTS.md,CONTEXT.md,CONTEXT-MAP.md,CONTRIBUTING.md,components.json}'
  # Build tooling, not product. make-icons.mjs draws the icon at package time and
  # has no business being readable inside the app it drew.
  - '!scripts/**'
asarUnpack:
  - resources/**
win:
  executableName: breakpoint
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # One universal artifact rather than a per-arch pair. electron-builder only
  # falls back to an ad-hoc signature for arm64 and universal, so a cross-built
  # x64 slice would ship with no signature at all and read as "damaged" to
  # Gatekeeper. See docs/adr/0017.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - deb
  maintainer: James Best
  category: Utility
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: false

# No `publish:` block. Breakpoint has no updater yet, and a publish config is what
# makes electron-builder bake Contents/Resources/app-update.yml into the app — the
# placeholder that lived here shipped `https://example.com/auto-updates` to users.
# The release workflow uploads artifacts itself. Restore this, pointed at github,
# in the same change that adds electron-updater.
